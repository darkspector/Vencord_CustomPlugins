name: Build

# Builds Vencord with every plugin in plugins/ baked in and publishes the compiled dist
# as a downloadable release. End users only need install.ps1 — no Node/pnpm.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — picks up upstream Vencord changes

permissions:
  contents: write # needed to create/update the release
  actions: write # needed to re-enable this workflow (keepalive)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: Vencord

      - name: Copy plugins into userplugins
        run: |
          for dir in plugin/plugins/*/; do
            name=$(basename "$dir")
            mkdir -p "Vencord/src/userplugins/$name"
            cp "$dir"index.ts* "Vencord/src/userplugins/$name/"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Vencord/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Vencord
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: Vencord
        run: pnpm build

      - name: Zip dist
        run: cd Vencord && zip -r ../dist.zip dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Auto-built Vencord including the VoiceConnectSound and StreamDock plugins.

            **To install:** download **vencord_install.bat** and double-click it. (No build tools needed.)
          files: |
            dist.zip
            plugin/installer-core.ps1
            plugin/vencord_install.bat

      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity; re-enabling via the API resets that timer.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml -R ${{ github.repository }}
